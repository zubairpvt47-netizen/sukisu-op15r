name: SUKISU build (OnePlus 15R kernel + manager)

# One run builds, in parallel: (1) the exact GKI kernel the phone ships for a given firmware (Google
# kernel/common release tag) with the SUKISU root driver (SukiSU Nova `builtin-new`, rebranded and bound to our
# manager) built in, plus SUSFS, NoMount, ZeroMount, Baseband Guard, NTSync, the networking/filesystem
# configs and CIFS; and (2) the SUKISU manager APK (our package name, our signing key). The `release` job
# publishes both to a GitHub Release after proving that the APK's certificate is the one the kernel trusts. To target a new firmware, read `uname -r` on the
# phone (the g<sha> part), find the matching android16-6.12-<YYYY-MM>_r<N> tag and pass it as
# common_ref / release_branch.
#
# Build pipeline adapted from Enginex0/Super-Builders (GPL-3.0); features from
# ahmed-alnassif/GKID-Kernels (GPL-3.0), maxsteeel/nomount, enginex0/zeromount, Baseband-guard.

on:
  workflow_dispatch:
    inputs:
      common_ref:
        description: "kernel/common ref to build (release tag of the phone's current kernel)"
        type: string
        default: "refs/tags/android16-6.12-2026-03_r54"
      release_branch:
        description: "Release branch that contains that tag (e.g. android16-6.12-2026-03)"
        type: string
        default: "android16-6.12-2026-03"
      expect_commit:
        description: "Abort unless kernel/common HEAD starts with this sha (the g<sha> from uname -r; empty = skip)"
        type: string
        default: "242e1a07f878"
      add_bbg:
        description: "Baseband Guard"
        type: boolean
        default: true
      add_nomount:
        description: "NoMount VFS path-redirection driver (self-contained fs/nomount; needs the NoMount metamodule in userspace)"
        type: boolean
        default: true
      nomount_ref:
        description: "NoMount commit (40-char sha)"
        type: string
        default: "00e7c5d4fdbf1e58decea3522b8eb7207a46d413"
      add_zeromount:
        description: "ZeroMount VFS path-redirection driver (/dev/zeromount; needs SUSFS and the ZeroMount module in userspace)"
        type: boolean
        default: true
      gkid_ntsync:
        description: "NTSync (Winlator/GameHub); replaces the stock driver, which is marked BROKEN, with the current one"
        type: boolean
        default: true
      gkid_net:
        description: "GKID networking/filesystem configs (ip_set, IPv6 NAT, netfilter/tc extras, TTL, exFAT/VFAT ...)"
        type: boolean
        default: true
      add_cifs:
        description: "CIFS/SMB client built in (mount Windows/NAS shares; netfs becomes built-in)"
        type: boolean
        default: true
      gkid_net_defaults:
        description: "Make BBR the default congestion control and fq_codel the default qdisc"
        type: boolean
        default: true
      ksu_commit:
        description: "Override the SukiSU Nova builtin-new commit (40-char sha; empty = pin from root-pins.env)"
        type: string
        default: ""
      susfs_commit:
        description: "Override the SUSFS commit (empty = pin from root-pins.env)"
        type: string
        default: ""
      add_ksu:
        description: "SukiSU Nova built into the kernel (off = root only via external LKM)"
        type: boolean
        default: true
      add_susfs:
        description: "SUSFS kernel patches (needs add_ksu; off = isolation build)"
        type: boolean
        default: true
      clean_baseline:
        description: "CONTROL BUILD: the stock source rebuilt, without KernelSU, SUSFS, NoMount, ZeroMount, Baseband Guard or the extras"
        type: boolean
        default: false
      release_version:
        description: "Kernel release version, shown in uname, the AnyKernel3 banner and the artifact name"
        type: string
        default: "v3.0.0"
      infra_tweaks:
        description: "Apply CRC-check bypass, protected-export removal and ABI-check bypass"
        type: boolean
        default: true
      publish_release:
        description: "Publish a GitHub Release (kernel zip + Image + manager APK) when both builds pass"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    name: "Kernel (OnePlus 15R)"
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      ANDROID_VER: android16
      KERNEL_VER: "6.12"
      VERSION_DIR: android16-6.12
      MANIFEST_BRANCH: common-${{ inputs.release_branch }}
      COMMON_BRANCH: ${{ inputs.release_branch }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache \
          /usr/share/swift /usr/local/share/boost /usr/local/julia* /usr/share/miniconda || true
        sudo apt-get remove -y -qq '^dotnet-.*' '^llvm-.*' 'php.*' azure-cli google-cloud-cli \
          microsoft-edge-stable google-chrome-stable firefox powershell mysql-server-core-* postgresql-* >/dev/null 2>&1 || true
        sudo apt-get autoremove -y -qq >/dev/null 2>&1 || true
        df -h /

    - name: Install host tools
      run: |
        # runner DNS/mirror hiccups are transient: refresh the index and retry instead of failing the build
        for i in 1 2 3 4 5; do
          sudo apt-get update -qq -o Acquire::Retries=3 \
            && sudo apt-get install -y -qq --fix-missing -o Acquire::Retries=3 lld binutils jq pigz zip dos2unix \
            && exit 0
          echo "apt attempt $i failed, retrying in $((i*15))s"; sleep $((i*15))
        done
        exit 1

    - name: Fetch helpers (AnyKernel3 flasher, repo tool)
      run: |
        # AnyKernel3 flasher template is vendored in this repo (android16-6.12/anykernel3, see SOURCE.txt)
        cp -r "$GITHUB_WORKSPACE/$VERSION_DIR/anykernel3" "$GITHUB_WORKSPACE/AnyKernel3"
        rm -f "$GITHUB_WORKSPACE/AnyKernel3/SOURCE.txt"
        mkdir -p "$GITHUB_WORKSPACE/git-repo"
        curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$GITHUB_WORKSPACE/git-repo/repo"
        chmod +x "$GITHUB_WORKSPACE/git-repo/repo"
        echo "$GITHUB_WORKSPACE/git-repo" >> "$GITHUB_PATH"

    - name: Setup environment
      run: |
        KERNEL_ROOT="$GITHUB_WORKSPACE/$ANDROID_VER-$KERNEL_VER"
        mkdir -p "$KERNEL_ROOT"
        {
          echo "KERNEL_ROOT=$KERNEL_ROOT"
          echo "DEFCONFIG=$KERNEL_ROOT/common/arch/arm64/configs/gki_defconfig"
          echo "DEFCONFIG_FRAGMENT=$KERNEL_ROOT/common/arch/arm64/configs/kernelsu_gki.fragment"
          echo "KERNEL_PATCHES=$GITHUB_WORKSPACE/$VERSION_DIR/gkid/patches"
          echo "ANYKERNEL3=$GITHUB_WORKSPACE/AnyKernel3"
          echo "GKID_REPORT=$GITHUB_WORKSPACE/gkid-report.txt"
          echo "GKID_FRAGMENT=$GITHUB_WORKSPACE/gkid-conditional.fragment"
        } >> "$GITHUB_ENV"

    - name: Sync kernel source (pinned to the phone's exact commit)
      working-directory: ${{ env.KERNEL_ROOT }}
      env:
        COMMON_REF: ${{ inputs.common_ref }}
      run: |
        git config --global user.name  "build"
        git config --global user.email "build@localhost"
        repo init -u https://android.googlesource.com/kernel/manifest -b "$MANIFEST_BRANCH" --depth=1
        # Pin ONLY the kernel/common project (the superproject line must stay on the branch).
        sed -i "/path=\"common\" name=\"kernel\/common\"/s|revision=\"${COMMON_BRANCH}\"|revision=\"${COMMON_REF}\"|" .repo/manifests/default.xml
        grep 'path="common" name="kernel/common"' .repo/manifests/default.xml
        repo --trace sync -c -j"$(nproc --all)" --fail-fast --no-tags --force-sync --no-clone-bundle
        echo "common HEAD: $(git -C common rev-parse HEAD)"
        grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL) =' common/Makefile

    - name: Verify the source matches the phone's kernel
      working-directory: ${{ env.KERNEL_ROOT }}
      env:
        EXPECT_COMMIT: ${{ inputs.expect_commit }}
      run: |
        SL=$(grep '^SUBLEVEL = ' common/Makefile | awk '{print $3}')
        HEAD=$(git -C common rev-parse HEAD)
        echo "Building Linux $KERNEL_VER.$SL from $HEAD"
        echo "SUBLEVEL=$SL" >> "$GITHUB_ENV"
        if [ "${{ inputs.clean_baseline }}" = "true" ]; then
          echo "ARTIFACT_BASE=OP15R-${KERNEL_VER}.${SL}-CLEAN-infra-${{ inputs.infra_tweaks }}" >> "$GITHUB_ENV"
        else
          ROOT=SUKISU
          [ "${{ inputs.add_ksu }}" = "true" ] || ROOT=NoKSU
          echo "ROOT_LABEL=$ROOT" >> "$GITHUB_ENV"
          SUF=""
          [ "${{ inputs.add_susfs }}" = "true" ] && SUF="$SUF-SUSFS"
          [ "${{ inputs.add_nomount }}" = "true" ] && SUF="$SUF-NoMount"
          [ "${{ inputs.add_zeromount }}" = "true" ] && SUF="$SUF-ZeroMount"
          [ "${{ inputs.add_bbg }}" = "true" ] && SUF="$SUF-BBG"
          [ "${{ inputs.gkid_ntsync }}" = "true" ] && SUF="$SUF-NTSync"
          [ "${{ inputs.add_cifs }}" = "true" ] && SUF="$SUF-CIFS"
          [ "${{ inputs.gkid_net_defaults }}" = "true" ] && SUF="$SUF-BBRdef"
          REL="${{ inputs.release_version }}"
          echo "KERNEL_REL=$REL" >> "$GITHUB_ENV"
          echo "KERNEL_LABEL=Core $REL (${KERNEL_VER}.${SL}) - ${ROOT}${SUF}" >> "$GITHUB_ENV"
          echo "ARTIFACT_BASE=OP15R-Core-${REL}-${KERNEL_VER}.${SL}-${ROOT}${SUF}" >> "$GITHUB_ENV"
        fi
        if [ -n "$EXPECT_COMMIT" ]; then
          case "$HEAD" in
            "$EXPECT_COMMIT"*) echo "source commit matches $EXPECT_COMMIT" ;;
            *) echo "::error::expected commit $EXPECT_COMMIT, got $HEAD"; exit 1 ;;
          esac
        fi

    - name: Load source pins
      run: |
        set -a; . "$GITHUB_WORKSPACE/$VERSION_DIR/root-pins.env"; set +a
        for v in NOVA_REPO NOVA_BRANCH NOVA_PIN SUSFS_REPO SUSFS_BRANCH SUSFS_PIN WK_REPO WK_PIN; do
          echo "$v=${!v}" >> "$GITHUB_ENV"
        done

    - name: Integrate SukiSU Nova (builtin-new)
      # Same result as `curl .../kernel/setup.sh | bash -s builtin-new` (clone to <root>/KernelSU, symlink into
      # drivers/kernelsu, Makefile + Kconfig entries), but pinned to a commit and with a fixed version string.
      if: ${{ !inputs.clean_baseline && inputs.add_ksu }}
      working-directory: ${{ env.KERNEL_ROOT }}
      env:
        KSU_OVERRIDE: ${{ inputs.ksu_commit }}
      run: |
        set -euo pipefail
        REPO="$NOVA_REPO"; DIR=nova-ksu   # not "KernelSU": setup.sh's name could collide with a repo folder
        PIN="${KSU_OVERRIDE:-$NOVA_PIN}"
        [[ "$PIN" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Nova commit must be a full 40-char sha"; exit 1; }
        [ ! -e common/drivers/kernelsu ] || { echo "::error::common/drivers/kernelsu already exists"; exit 1; }
        [ ! -e "$DIR" ] || { echo "::error::$KERNEL_ROOT/$DIR already exists"; exit 1; }
        echo "KSU_DIR=$DIR" >> "$GITHUB_ENV"
        # setup.sh ends with a `git checkout <ref>` that silently falls back to the default branch when the
        # ref is misspelled (that gave builds without SUSFS) -> pin by sha and verify the branch really exists.
        for i in 1 2 3 4 5; do git clone --no-checkout "$REPO" "$DIR" && break; rm -rf "./$DIR"; sleep 8; done
        git -C "$DIR" rev-parse --verify -q "origin/$NOVA_BRANCH" >/dev/null || { echo "::error::branch $NOVA_BRANCH not found in $REPO"; exit 1; }
        git -C "$DIR" fetch origin "$PIN"
        git -C "$DIR" checkout --detach "$PIN"
        [ "$(git -C "$DIR" rev-parse HEAD)" = "$PIN" ] || { echo "::error::Nova commit mismatch"; exit 1; }
        git -C "$DIR" merge-base --is-ancestor "$PIN" "origin/$NOVA_BRANCH" ||
          echo "::warning::$PIN is not on origin/$NOVA_BRANCH (pin override?)"
        # Deterministic version. kernel/Makefile asks the GitHub API (curl) and `git rev-list --count main`
        # for KSU_VERSION; inside the Kleaf sandbox neither is reliable, so pin both. Nova's formula is
        # 30000 + commits - 4001 (VERSION_OFFSET); the manager gates on UAPI (6), not on this number.
        COUNT="$(git -C "$DIR" rev-list --count "$PIN")"
        KSU_NUM=$((30000 + COUNT - 4001))
        SHORT="$(git -C "$DIR" rev-parse --short=8 "$PIN")"
        MK="$DIR/kernel/Makefile"
        [ "$(grep -c '^CURL_BIN := ' "$MK")" = "1" ] || { echo "::error::Nova Makefile CURL_BIN anchor not found"; exit 1; }
        [ "$(grep -c '^KSU_VERSION_FULL := ' "$MK")" = "1" ] || { echo "::error::Nova Makefile KSU_VERSION_FULL anchor not found"; exit 1; }
        [ "$(grep -c '^KSU_VERSION     := ' "$MK")" = "1" ] || { echo "::error::Nova Makefile KSU_VERSION anchor not found"; exit 1; }
        # (no trailing "# comments" on these lines: make keeps the spaces before them inside the value, and
        # KSU_VERSION_FULL ends up inside a C string literal)
        sed -i "s|^CURL_BIN := .*|CURL_BIN := /usr/bin/env true|" "$MK"
        sed -i "s|^KSU_VERSION     := .*|KSU_VERSION     := ${KSU_NUM}|" "$MK"
        sed -i "s|^KSU_VERSION_FULL := .*|KSU_VERSION_FULL := v3.0.0-${SHORT}@${NOVA_BRANCH}|" "$MK"
        # Nova compiles ksu.o with -g0 in non-debug builds, but this GKI kernel runs gendwarfksyms (symbol
        # versioning) on every object and fails with "no debugging information?" (run 43825917590). Keep DWARF.
        [ "$(grep -c -- 'CFLAGS_ksu.o += -g0 -fno-unwind-tables' "$MK")" = "1" ] || { echo "::error::Nova Makefile -g0 anchor not found"; exit 1; }
        sed -i 's/CFLAGS_ksu.o += -g0 -fno-unwind-tables/CFLAGS_ksu.o += -fno-unwind-tables/' "$MK"
        grep -nE '^(CURL_BIN|KSU_VERSION|KSU_VERSION_FULL) |^CFLAGS_ksu.o \+= -fno-unwind-tables' "$MK"
        # Bind the driver to OUR manager (package name + signing certificate) and drop the foreign trusted keys
        . "$GITHUB_WORKSPACE/branding.env"
        python3 "$GITHUB_WORKSPACE/rebrand/rebrand-kernel.py" "$DIR" "$PACKAGE_NAME" "$CERT_SIZE" "$CERT_SHA256"
        echo "$DIR @ $(git -C "$DIR" log -1 --format='%h %cs %s') | KSU_VERSION=${KSU_NUM} | manager package: $(grep -m1 '^KSU_PACKAGE_NAME' "$MK")"
        ln -s "$(realpath --relative-to=common/drivers "$PWD/$DIR/kernel")" common/drivers/kernelsu
        grep -q 'obj-$(CONFIG_KSU) += kernelsu/' common/drivers/Makefile ||
          printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> common/drivers/Makefile
        grep -q 'source "drivers/kernelsu/Kconfig"' common/drivers/Kconfig ||
          sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' common/drivers/Kconfig
        ls -l common/drivers/kernelsu

    - name: LSM slot for Baseband Guard (MAX_LSM_COUNT)
      # MAX_LSM_COUNT is derived from the upstream LSM configs only and all 5 slots are used, so a static
      # LSM such as Baseband Guard would make the kernel drop the last ordered LSM (bpf). Count it.
      # Nova (KSU_LSM_SECURITY_HOOKS) on 6.8+ ARM64 does not call security_add_hooks(): lsm_hooks_static.c
      # redirects the security.c callers via kallsyms, so it registers no LSM and needs no slot (the
      # "no security_add_hooks" step below fails the build if that ever changes).
      if: ${{ inputs.add_bbg && !inputs.clean_baseline }}
      working-directory: ${{ env.KERNEL_ROOT }}
      run: bash "$GITHUB_WORKSPACE/$VERSION_DIR/build-helpers/add-lsm-slots.sh" common BBG=CONFIG_BBG

    - name: Fix old-kernel compatibility helpers
      if: ${{ !inputs.clean_baseline }}
      working-directory: ${{ env.KERNEL_ROOT }}/common
      run: |
        FIX_SCRIPT="$GITHUB_WORKSPACE/$VERSION_DIR/build-helpers/fix-old-kernel-compat.sh"
        [ -f "$FIX_SCRIPT" ] && bash "$FIX_SCRIPT" "$KERNEL_ROOT/common" "$SUBLEVEL" || true

    - name: Fetch SUSFS + WildKernels SUSFS helpers
      if: ${{ !inputs.clean_baseline && inputs.add_susfs && inputs.add_ksu }}
      env:
        SUSFS_OVERRIDE: ${{ inputs.susfs_commit }}
      run: |
        set -euo pipefail
        PIN="${SUSFS_OVERRIDE:-$SUSFS_PIN}"
        S="$GITHUB_WORKSPACE/susfs4ksu"
        for i in 1 2 3 4 5; do git clone -b "$SUSFS_BRANCH" "$SUSFS_REPO" "$S" && break; rm -rf "$S"; sleep 8; done
        git -C "$S" checkout --detach "$PIN"
        echo "SUSFS $(git -C "$S" log -1 --format='%h %cs %s') | $(grep -h 'define SUSFS_VERSION' "$S/kernel_patches/include/linux/susfs.h")"
        for i in 1 2 3 4 5; do git clone --no-checkout "$WK_REPO" "$GITHUB_WORKSPACE/wk" && break; rm -rf "$GITHUB_WORKSPACE/wk"; sleep 8; done
        git -C "$GITHUB_WORKSPACE/wk" checkout --detach "$WK_PIN"

    - name: Apply SUSFS kernel patch
      if: ${{ !inputs.clean_baseline && inputs.add_susfs && inputs.add_ksu }}
      working-directory: ${{ env.KERNEL_ROOT }}/common
      run: |
        set -euo pipefail
        S="$GITHUB_WORKSPACE/susfs4ksu/kernel_patches"; WK="$GITHUB_WORKSPACE/wk/.github/scripts"
        P="50_add_susfs_in_gki-${ANDROID_VER}-${KERNEL_VER}.patch"
        cp "$S/fs/"* fs/
        cp "$S/include/linux/"* include/linux/
        cp "$S/$P" ./
        # susfs4ksu bug (395a8c0 .. 9b0b13f): the selinux-hide code calls SUSFS_LOGI_RL/LOGE_RL, but the
        # !CONFIG_KSU_SUSFS_ENABLE_LOG branch only stubs SUSFS_LOGI/LOGE -> implicit-declaration error
        # with logging off (WildKernels builds with logging on, so it never hits this). Add no-op stubs.
        python3 - fs/susfs.c <<'PYEOF'
        import sys
        p = sys.argv[1]
        s = open(p, encoding='utf-8').read()
        if 'SUSFS_LOGI_RL' not in s:
            raise SystemExit(0)
        stub = ('#ifndef SUSFS_LOGI_RL\n#define SUSFS_LOGI_RL(fmt, ...)\n#endif\n'
                '#ifndef SUSFS_LOGE_RL\n#define SUSFS_LOGE_RL(fmt, ...)\n#endif\n\n')
        anchor = '/* selinux hide */'
        if '#ifndef SUSFS_LOGI_RL' in s:
            raise SystemExit(0)
        i = s.find(anchor)
        if i < 0:
            i = s.find('static DEFINE_MUTEX(')
        if i < 0:
            sys.exit('fs/susfs.c: no anchor for the SUSFS_LOG*_RL stubs')
        s = s[:i] + stub + s[i:]
        open(p, 'w', encoding='utf-8').write(s)
        print('fs/susfs.c: added SUSFS_LOGI_RL/LOGE_RL no-op stubs for ENABLE_LOG=n')
        PYEOF
        # same sequence as WildKernels .github/actions/susfs-patches for android16-6.12
        python3 "$WK/susfs_guard_priority_helpers.py" fs/susfs.c
        grep -q 'i_user_ns' include/linux/fs.h || python3 "$WK/susfs_idmap_compat.py" fs/susfs.c
        python3 "$WK/susfs_restore_context.py" "$P" "$PWD"
        python3 "$WK/apply_susfs_compat.py" "$PWD" "$P"
        python3 "$WK/susfs_fdinfo_fanotify_arity.py" "$PWD"
        if grep -q 'VMA_PAD_START(' fs/proc/task_mmu.c && ! grep -qE '#include <linux/pgsize_migration(_inline)?\.h>|define VMA_PAD_START' fs/proc/task_mmu.c; then
          sed -i '1a #ifndef VMA_PAD_START\n#define VMA_PAD_START(vma) ((vma)->vm_end)\n#endif' fs/proc/task_mmu.c
          echo "added VMA_PAD_START fallback"
        fi
        rm -f "$P"
        # apply_susfs_compat.py leaves .orig backups for hunks applied at an offset; real failures
        # leave .rej, which the reject check below still catches
        echo "offset backups: $(find . -name '*.orig' | wc -l)"; find . -name '*.orig' -delete

    - name: Add ZeroMount (VFS driver)
      # The ZeroMount hunks sit inside SUSFS context, so they apply only on top of the SUSFS patch, and
      # before NoMount (both add an entry at the end of fs/Kconfig). No fuzz: a context mismatch must fail.
      if: ${{ inputs.add_zeromount && inputs.add_susfs && inputs.add_ksu && !inputs.clean_baseline }}
      working-directory: ${{ env.KERNEL_ROOT }}/common
      run: patch -p1 -F0 --forward --no-backup-if-mismatch < "$GITHUB_WORKSPACE/$VERSION_DIR/zeromount/60_zeromount-${ANDROID_VER}-${KERNEL_VER}.patch"

    - name: Check Nova <-> SUSFS pairing (no KernelSU-side patch)
      # Nova builtin-new already has the KernelSU-side SUSFS glue (CONFIG_KSU_SUSFS + inline hooks), so
      # susfs4ksu's KernelSU/10_enable_susfs_for_ksu.patch is NOT applied (it targets tiann/KernelSU).
      # Instead prove that the kernel-side SUSFS patch provides every hook Nova's side expects.
      if: ${{ !inputs.clean_baseline && inputs.add_susfs && inputs.add_ksu }}
      working-directory: ${{ env.KERNEL_ROOT }}
      run: |
        set -euo pipefail
        grep -q '^config KSU_SUSFS$' "$KSU_DIR/kernel/Kconfig" || { echo "::error::Nova has no CONFIG_KSU_SUSFS (wrong branch?)"; exit 1; }
        grep -q '^config KSU_SUSFS_INLINE_HOOK$' "$KSU_DIR/kernel/Kconfig" || { echo "::error::Nova has no KSU_SUSFS_INLINE_HOOK"; exit 1; }
        [ -f common/fs/susfs.c ] && [ -f common/include/linux/susfs.h ] || { echo "::error::SUSFS kernel side missing"; exit 1; }
        # every ksu_* function the SUSFS kernel side calls must be defined by Nova (kernel link error otherwise)
        MISS=0
        for fn in $(grep -rhoE '\bksu_[a-z0-9_]+\s*\(' common/fs common/include/linux common/kernel common/drivers/input 2>/dev/null \
                    | sed -E 's/\s*\($//' | sort -u); do
          if grep -rqE "^[A-Za-z_][A-Za-z0-9_ \*]*\b${fn}\s*\(" "$KSU_DIR/kernel" --include='*.c' --include='*.h'; then
            echo "ok   $fn"
          else
            echo "::error::$fn is called by the SUSFS kernel patch but not defined by Nova"; MISS=1
          fi
        done
        [ "$MISS" = "0" ] || exit 1
        # Nova must not register an LSM through security_add_hooks() (that needs a slot; it was the old
        # boot panic "Too many LSMs registered")
        if grep -rn 'security_add_hooks(' "$KSU_DIR/kernel" --include='*.c' | grep -v '^\s*//'; then
          echo "::error::Nova registers an LSM via security_add_hooks - needs an LSM slot (add to the LSM step)"; exit 1
        fi
        echo "no security_add_hooks() in Nova: only BBG needs an LSM slot"

    - name: Add NoMount (fs/nomount, built-in)
      # NoMount is a self-contained driver (own inode/dir ops, no hooks in core VFS files), so it
      # needs neither SUSFS context nor patch hunks. The source is copied (not symlinked) into the
      # tree and pinned to a commit.
      if: ${{ inputs.add_nomount && !inputs.clean_baseline }}
      working-directory: ${{ env.KERNEL_ROOT }}/common
      env:
        NOMOUNT_REF: ${{ inputs.nomount_ref }}
      run: |
        set -euo pipefail
        for i in 1 2 3 4 5; do git clone --no-checkout https://github.com/maxsteeel/nomount.git "$GITHUB_WORKSPACE/nomount" && break; rm -rf "$GITHUB_WORKSPACE/nomount"; sleep 8; done
        git -C "$GITHUB_WORKSPACE/nomount" fetch --tags origin
        git -C "$GITHUB_WORKSPACE/nomount" checkout --detach "$NOMOUNT_REF"
        echo "NoMount $(git -C "$GITHUB_WORKSPACE/nomount" log -1 --format='%h %cs %s')"
        [ ! -e fs/nomount ] || { echo "::error::fs/nomount already exists"; exit 1; }
        mkdir fs/nomount
        cp "$GITHUB_WORKSPACE"/nomount/kernel/src/* fs/nomount/
        grep -q 'nomount' fs/Makefile || printf '\nobj-$(CONFIG_NOMOUNT) += nomount/\n' >> fs/Makefile
        grep -q 'fs/nomount/Kconfig' fs/Kconfig || python3 - fs/Kconfig <<'PYEOF'
        import sys
        p = sys.argv[1]
        s = open(p, encoding='utf-8').read()
        i = s.rfind('\nendmenu')
        if i < 0:
            sys.exit('fs/Kconfig: endmenu anchor not found')
        open(p, 'w', encoding='utf-8').write(s[:i] + '\nsource "fs/nomount/Kconfig"\n' + s[i:])
        print('fs/Kconfig: sourced fs/nomount/Kconfig')
        PYEOF
        ls -l fs/nomount

    - name: Fix SUSFS compatibility
      if: ${{ !inputs.clean_baseline && inputs.add_susfs && inputs.add_ksu }}
      working-directory: ${{ env.KERNEL_ROOT }}/common
      run: |
        FIX="$GITHUB_WORKSPACE/$VERSION_DIR/build-helpers/fix-susfs-compat.sh"
        [ -f "$FIX" ] && bash "$FIX" . "$SUBLEVEL" "$ANDROID_VER" "$KERNEL_VER" "$KERNEL_PATCHES" || true

    - name: Apply NTSync and the networking/filesystem configs
      if: ${{ !inputs.clean_baseline }}
      working-directory: ${{ env.KERNEL_ROOT }}/common
      env:
        GKID_NTSYNC: ${{ inputs.gkid_ntsync }}
        GKID_NET: ${{ inputs.gkid_net }}
        GKID_NET_DEFAULTS: ${{ inputs.gkid_net_defaults }}
      run: bash "$GITHUB_WORKSPACE/scripts/gkid-extras.sh" . "$GITHUB_WORKSPACE/$VERSION_DIR/gkid" "$GKID_FRAGMENT" "$GKID_REPORT"

    - name: CIFS/SMB client (built in)
      # WildKernels .github/actions/cifs for android16-6.12: CIFS=y pulls NETFS_SUPPORT=y, and Kleaf
      # fails if its GKI module list still names fs/netfs/netfs.ko. Stock loads netfs.ko from
      # system_dlkm (9pnet uses it); with netfs built in that insmod returns EEXIST, which
      # libmodprobe treats as already loaded.
      if: ${{ inputs.add_cifs && !inputs.clean_baseline }}
      working-directory: ${{ env.KERNEL_ROOT }}/common
      run: |
        set -euo pipefail
        printf '%s\n' '# [cifs]' CONFIG_NETWORK_FILESYSTEMS=y CONFIG_NETFS_SUPPORT=y CONFIG_KEYS=y \
          CONFIG_CIFS=y CONFIG_CIFS_XATTR=y CONFIG_CIFS_POSIX=y >> "$GKID_FRAGMENT"
        python3 "$GITHUB_WORKSPACE/$VERSION_DIR/build-helpers/cifs_modules_fix.py" "$PWD" fs/netfs/netfs.ko

    - name: Fail on patch rejects
      run: |
        REJ=$(find "$KERNEL_ROOT/common" "$KERNEL_ROOT/$KSU_DIR" \( -name '*.rej' -o -name '*.orig' \) 2>/dev/null | head -20)
        if [ -n "$REJ" ]; then echo "::error::patch rejects found:"; echo "$REJ"; exit 1; fi
        echo "no patch rejects"

    - name: Setup Baseband Guard
      if: ${{ (inputs.add_bbg) && !inputs.clean_baseline }}
      working-directory: ${{ env.KERNEL_ROOT }}
      run: bash "$GITHUB_WORKSPACE/$VERSION_DIR/build-helpers/setup-bbg.sh" . "$DEFCONFIG" "$DEFCONFIG_FRAGMENT"

    - name: Configure kernel
      if: ${{ !inputs.clean_baseline }}
      working-directory: ${{ env.KERNEL_ROOT }}
      run: |
        FRAGMENT="$GITHUB_WORKSPACE/$VERSION_DIR/defconfig.fragment"
        HELPERS="$GITHUB_WORKSPACE/$VERSION_DIR/build-helpers"
        # no build/build.sh on 6.12 -> Kleaf applies the fragment via --defconfig_fragment
        bash "$HELPERS/assemble-defconfig.sh" "$FRAGMENT" "$DEFCONFIG_FRAGMENT" "$DEFCONFIG" --susfs --overlayfs --kleaf

        # GKID groups that applied cleanly (+ config-only groups)
        if [ -s "$GKID_FRAGMENT" ]; then cat "$GKID_FRAGMENT" >> "$DEFCONFIG_FRAGMENT"; fi

        # NoMount config (built-in; only if the driver was added)
        if [ "${{ inputs.add_nomount }}" = "true" ] && [ -f common/fs/nomount/Kconfig ]; then
          sed -i '/^CONFIG_NOMOUNT=/d;/^# CONFIG_NOMOUNT is not set/d' "$DEFCONFIG_FRAGMENT"
          echo "CONFIG_NOMOUNT=y" >> "$DEFCONFIG_FRAGMENT"
        fi
        # ZeroMount config (built-in; only if its patch was applied)
        if [ "${{ inputs.add_zeromount }}" = "true" ] && grep -q '^config ZEROMOUNT' common/fs/Kconfig; then
          sed -i '/^CONFIG_ZEROMOUNT=/d;/^# CONFIG_ZEROMOUNT is not set/d' "$DEFCONFIG_FRAGMENT"
          echo "CONFIG_ZEROMOUNT=y" >> "$DEFCONFIG_FRAGMENT"
        fi

        # drop CONFIG_KSU_* symbols that don't exist in this tree
        while IFS='=' read -r cfg _; do
          symbol="${cfg#CONFIG_}"
          grep -Rqx "config ${symbol}" common/ ${KSU_DIR:+$KSU_DIR/} --include='Kconfig*' 2>/dev/null && continue
          sed -i "/^${cfg}=/d" "$DEFCONFIG_FRAGMENT" "$DEFCONFIG"
        done < <(grep '^CONFIG_KSU_' "$DEFCONFIG_FRAGMENT" 2>/dev/null || true)
        if ! grep -q '^CONFIG_KSU_SUSFS=' "$DEFCONFIG_FRAGMENT" 2>/dev/null; then
          sed -i '/^CONFIG_KSU_SUSFS_/d' "$DEFCONFIG_FRAGMENT" "$DEFCONFIG"
        fi

        # always keep module vermagic flags identical to stock: SMP preempt mod_unload modversions
        sed -i '/^CONFIG_MODVERSIONS=/d;/^CONFIG_MODULE_UNLOAD=/d;/^CONFIG_PREEMPT=/d' "$DEFCONFIG_FRAGMENT"

        # last-wins per CONFIG_ key (GKID fragments are appended after the base fragment)
        tac "$DEFCONFIG_FRAGMENT" | awk -F= '/^CONFIG_/{if(seen[$1]++)next} {print}' | tac > "$DEFCONFIG_FRAGMENT.tmp" && mv "$DEFCONFIG_FRAGMENT.tmp" "$DEFCONFIG_FRAGMENT"

        bash "$HELPERS/bypass-abi-check.sh" . "$ANDROID_VER" "$KERNEL_VER"

        echo "----- final fragment -----"
        cat "$DEFCONFIG_FRAGMENT"

    - name: Module check bypass (CRC) + protected exports cleanup
      if: ${{ inputs.infra_tweaks }}
      working-directory: ${{ env.KERNEL_ROOT }}
      run: |
        TARGET_FILE="$KERNEL_ROOT/common/kernel/module/version.c"
        sed -i '/bad_version:/{:a;n;/return 0;/{s/return 0;/return 1;/;b};ba}' "$TARGET_FILE"
        rm -f common/android/abi_gki_protected_exports_* || true
        sed -i 's/protected_modules = \[.*\]/protected_modules = []/' common/modules.bzl || true

    - name: Clean build flags
      if: ${{ inputs.infra_tweaks }}
      working-directory: ${{ env.KERNEL_ROOT }}
      run: bash "$GITHUB_WORKSPACE/$VERSION_DIR/build-helpers/clean-build-flags.sh" . "$KERNEL_VER" "OP15R-Core-${{ inputs.release_version }}"  # uname e.g. 6.12.69-android16-6-4k-OP15R-Core-v1.0.0

    - name: Build kernel (Kleaf/Bazel)
      working-directory: ${{ env.KERNEL_ROOT }}
      run: |
        set -o pipefail   # a failed bazel build must not be masked by the pipe into tee
        BUILD_RC=0
        # prebuilt clang sysroot lacks glibc 2.39 C23 symbols -> link host tools against system libc
        if [ -f common/tools/bpf/resolve_btfids/Makefile ]; then
          echo 'override KBUILD_HOSTLDFLAGS += --sysroot=/' >> common/tools/bpf/resolve_btfids/Makefile
          echo 'override LDFLAGS += --sysroot=/' >> common/tools/bpf/resolve_btfids/Makefile
        fi
        FRAG_ARG=""
        [ -f "$DEFCONFIG_FRAGMENT" ] && FRAG_ARG="--defconfig_fragment=//common:arch/arm64/configs/kernelsu_gki.fragment"
        echo "fragment arg: ${FRAG_ARG:-<none, stock config>}"
        tools/bazel build --config=fast --lto=none $FRAG_ARG \
          //common:kernel_aarch64_dist 2>&1 | tee "$GITHUB_WORKSPACE/bazel-build.log" || BUILD_RC=${PIPESTATUS[0]}
        if [ "$BUILD_RC" -ne 0 ]; then
          if [ -f bazel-bin/common/kernel_aarch64/Image ]; then
            echo "::warning::Build exited $BUILD_RC but Image exists"
          else
            exit "$BUILD_RC"
          fi
        fi

    - name: Verify the built kernel
      working-directory: ${{ env.KERNEL_ROOT }}
      run: |
        IMG=bazel-bin/common/kernel_aarch64/Image
        [ -f "$IMG" ] || { echo "::error::Image not found"; find . -name Image -type f | head; exit 1; }
        ls -l "$IMG"
        sha256sum "$IMG"
        echo "--- version string:"
        strings -n 20 "$IMG" | grep -m1 'Linux version' || true
        echo "--- key features present in the binary:"
        for s in susfs nomount zeromount kernelsu baseband_guard ntsync; do
          printf '%-16s %s\n' "$s" "$(strings "$IMG" | grep -ci "$s")"
        done
        echo "--- vermagic flags in binary:"
        strings "$IMG" | grep -m2 'SMP preempt' || true
        CFG=$(find bazel-bin/common bazel-out -name .config -path '*kernel_aarch64*' -type f 2>/dev/null | head -1)
        [ -n "$CFG" ] || CFG=$(find bazel-bin/common -name .config -type f 2>/dev/null | head -1)
        if [ "${{ inputs.add_ksu }}" = "true" ] && [ "${{ inputs.clean_baseline }}" != "true" ]; then
          [ -n "$CFG" ] || { echo "::error::final .config not found for the KSU/SUSFS assert"; exit 1; }
          echo "--- final config: $CFG"
          # Nova: LSM-hook backend + ADB root + hosts redirect + KPM (the Kernel Extension Center features
          # have no Kconfig switch: cpu/version/AVC spoofing are always compiled in)
          WANT="CONFIG_KSU CONFIG_KSU_LSM_SECURITY_HOOKS CONFIG_KSU_FEATURE_ADBROOT CONFIG_KSU_HOSTSREDIRECT CONFIG_KPM CONFIG_KALLSYMS CONFIG_KALLSYMS_ALL"
          if [ "${{ inputs.add_susfs }}" = "true" ]; then
            WANT="$WANT CONFIG_KSU_SUSFS CONFIG_KSU_SUSFS_INLINE_HOOK CONFIG_KSU_SUSFS_SUS_PATH CONFIG_KSU_SUSFS_SUS_MOUNT CONFIG_KSU_SUSFS_SUS_KSTAT CONFIG_KSU_SUSFS_SUS_MAP CONFIG_KSU_SUSFS_SPOOF_UNAME CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG CONFIG_KSU_SUSFS_OPEN_REDIRECT CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS CONFIG_KSU_SUSFS_PRIORITY_UID_FILTER"
          fi
          # these two hook backends are mutually exclusive with SUSFS (Kconfig: depends on !KSU_SUSFS)
          for bad in CONFIG_KSU_HACK_ARM64_BRANCH_LINK CONFIG_KSU_TAMPER_SYSCALL_TABLE; do
            if grep -qx "${bad}=y" "$CFG"; then echo "::error::$bad=y must not be set together with SUSFS"; exit 1; fi
          done
          [ "${{ inputs.add_nomount }}" = "true" ] && WANT="$WANT CONFIG_NOMOUNT"
          [ "${{ inputs.add_zeromount }}" = "true" ] && WANT="$WANT CONFIG_ZEROMOUNT"
          [ "${{ inputs.add_bbg }}" = "true" ] && WANT="$WANT CONFIG_BBG"
          [ "${{ inputs.gkid_ntsync }}" = "true" ] && WANT="$WANT CONFIG_NTSYNC"
          [ "${{ inputs.add_cifs }}" = "true" ] && WANT="$WANT CONFIG_CIFS CONFIG_NETFS_SUPPORT"
          [ "${{ inputs.gkid_net_defaults }}" = "true" ] && WANT="$WANT CONFIG_DEFAULT_BBR"
          MISS=0
          for c in $WANT; do
            if grep -qx "${c}=y" "$CFG"; then echo "ok   $c=y"; else echo "::error::$c is not =y in the final config"; MISS=1; fi
          done
          grep -E '^CONFIG_KSU' "$CFG" || true
          [ "$MISS" = "0" ] || exit 1
        fi

    - name: Package AnyKernel3
      run: |
        cp "$KERNEL_ROOT/bazel-bin/common/kernel_aarch64/Image" "$ANYKERNEL3/Image"
        # fill the version/repo placeholders of our own flasher template
        sed -i "s|@VERSION@|${{ inputs.release_version }}|g; s|@REPO_URL@|https://github.com/${{ github.repository }}|g" \
          "$ANYKERNEL3/anykernel.sh" "$ANYKERNEL3/banner"
        sed -i "s|^kernel.string=.*|kernel.string=OnePlus 15R ${KERNEL_LABEL:-${KERNEL_VER}.${SUBLEVEL} - ${ARTIFACT_BASE#OP15R-}}|" "$ANYKERNEL3/anykernel.sh"
        mkdir -p out
        cp "$KERNEL_ROOT/bazel-bin/common/kernel_aarch64/Image" out/Image
        (cd "$ANYKERNEL3" && zip -r9 -q "$GITHUB_WORKSPACE/out/${ARTIFACT_BASE}-AnyKernel3.zip" .)
        cp "$GKID_REPORT" out/gkid-report.txt 2>/dev/null || true
        # ABI evidence: export CRCs of every kernel symbol (used to check vendor-module compatibility)
        for f in Module.symvers System.map; do
          src=$(find "$KERNEL_ROOT/bazel-bin/common" "$KERNEL_ROOT/out" -maxdepth 4 -name "$f" -type f 2>/dev/null | head -1)
          [ -n "$src" ] && cp "$src" "out/$f" && echo "collected $f from $src" || echo "::warning::$f not found"
        done
        src=$(find "$KERNEL_ROOT/bazel-bin/common" "$KERNEL_ROOT/out" -maxdepth 4 -name ".config" -type f 2>/dev/null | head -1)
        [ -n "$src" ] && cp "$src" out/final.config || echo "::warning::.config not found"
        cp "$DEFCONFIG_FRAGMENT" out/final-config.fragment 2>/dev/null || true
        (cd out && sha256sum * > SHA256SUMS.txt)
        ls -l out

    - name: Collect patch rejects
      if: always()
      run: |
        mkdir -p patch-rejects
        find "$KERNEL_ROOT" -type f -name '*.rej' -print0 2>/dev/null | while IFS= read -r -d '' f; do
          rel="${f#"$KERNEL_ROOT"/}"; mkdir -p "patch-rejects/$(dirname "$rel")"; cp "$f" "patch-rejects/$rel"
        done
        [ -f "$GKID_REPORT" ] && cp "$GKID_REPORT" patch-rejects/ || true
        [ -f "$GITHUB_WORKSPACE/bazel-build.log" ] && tail -n 400 "$GITHUB_WORKSPACE/bazel-build.log" > patch-rejects/bazel-tail.log || true

    - name: Upload kernel
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.ARTIFACT_BASE }}
        path: out/*
        if-no-files-found: error
        compression-level: 6

    - name: Upload diagnostics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: diagnostics
        path: patch-rejects/
        if-no-files-found: ignore

    - name: Job summary
      if: always()
      run: |
        {
          echo "## OP15R kernel 6.12.${SUBLEVEL:-?}"
          echo ""
          echo '```'
          cat "$GKID_REPORT" 2>/dev/null || echo "(no gkid report)"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------------------------------------------
  # Manager APK. Runs in parallel with the kernel job above: the signing certificate (not the APK) is what
  # the kernel is bound to, and it is fixed in branding.env, so neither job waits for the other.
  # ------------------------------------------------------------------------------------------------
  manager:
    name: "Manager APK (SUKISU)"
    if: ${{ !inputs.clean_baseline }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NDK_VERSION: "29.0.14206865"
      ZYGISK_NDK_VERSION: "27.2.12479018"
      BUILD_TOOLS: "37.0.0"
    steps:
    - name: Checkout (branding + rebrand scripts)
      uses: actions/checkout@v4

    - name: Load branding
      run: |
        set -euo pipefail
        . branding.env
        case "$CERT_SIZE" in 0x*) ;; *) echo "::error::branding.env has no certificate values yet"; exit 1 ;; esac
        for v in APP_NAME PACKAGE_NAME CERT_SIZE CERT_SHA256 NOVA_REPO NOVA_MANAGER_PIN; do echo "$v=${!v}" >> "$GITHUB_ENV"; done

    - name: Check signing secrets
      env:
        KS_B64: ${{ secrets.SUKISU_KEYSTORE_B64 }}
        KS_PASS: ${{ secrets.SUKISU_KEYSTORE_PASSWORD }}
      run: |
        [ -n "$KS_B64" ] && [ -n "$KS_PASS" ] || { echo "::error::repository secrets SUKISU_KEYSTORE_B64 / SUKISU_KEYSTORE_PASSWORD are not set"; exit 1; }

    - name: Fetch SukiSU Nova (manager side, full history, submodules)
      run: |
        set -euo pipefail
        for i in 1 2 3 4 5; do git clone --no-checkout "$NOVA_REPO" nova && break; rm -rf nova; sleep 8; done
        git -C nova checkout --detach "$NOVA_MANAGER_PIN"
        [ "$(git -C nova rev-parse HEAD)" = "$NOVA_MANAGER_PIN" ] || { echo "::error::Nova pin mismatch"; exit 1; }
        git -C nova submodule update --init --recursive
        git -C nova log -1 --format='Nova manager source: %h %cs %s'

    - name: Rebrand (name, strings, own icons, arm64 only)
      run: bash rebrand/rebrand-manager.sh nova

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 21

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Android SDK / NDK
      run: |
        set -euo pipefail
        SDKM="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
        [ -x "$SDKM" ] || SDKM="$(command -v sdkmanager)"
        yes | "$SDKM" --licenses >/dev/null || true
        "$SDKM" "platforms;android-37.0" "build-tools;${BUILD_TOOLS}" "ndk;${NDK_VERSION}" "ndk;${ZYGISK_NDK_VERSION}"
        echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

    - name: Rust toolchains
      run: |
        set -euo pipefail
        rustup update stable
        rustup target add aarch64-linux-android
        # BuiltZygisk is built with nightly + cargo-ndk (as upstream)
        rustup toolchain install nightly --profile minimal --component rust-src
        rustup target add --toolchain nightly aarch64-linux-android x86_64-linux-android armv7-linux-androideabi

    - name: Install cargo-ndk
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-ndk

    - name: Build BuiltZygisk (built-in Zygisk, NyaZygisk)
      working-directory: nova/external/BuiltZygisk
      run: |
        set -euo pipefail
        export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/$ZYGISK_NDK_VERSION"
        rustup override set nightly
        chmod +x ./gradlew
        ./gradlew zipRelease -Porg.gradle.parallel=true -Porg.gradle.vfs.watch=true -Dorg.gradle.jvmargs=-Xmx2048m

    - name: Pack BuiltZygisk into ksud assets (aarch64)
      run: |
        set -euo pipefail
        ZIP=$(find nova/external/BuiltZygisk/module/build/outputs/release -type f -name 'NyaZygisk-v*-release.zip' | head -n 1)
        test -f "$ZIP"
        rm -rf zy && mkdir zy && unzip -q "$ZIP" -d zy
        D=nova/userspace/ksud/bin/aarch64
        cp nova/external/BuiltZygisk/module/src/sepolicy.rule "$D/zygisk-sepolicy.rule"
        cp zy/module.prop "$D/zygisk-module.prop"
        cp zy/bin/arm64-v8a/zygiskd "$D/zygiskd"
        cp zy/lib/arm64-v8a/libzygisk_ptrace.so "$D/zygisk-ptrace"
        cp zy/lib/arm64-v8a/libzygisk.so "$D/libzygisk.so"
        [ -f zy/lib/armeabi-v7a/libzygisk.so ] && cp zy/lib/armeabi-v7a/libzygisk.so "$D/libzygisk32.so" || true
        ls -l "$D"

    - name: Build ksud (aarch64) with our package name
      working-directory: nova
      env:
        KSU_PACKAGE_NAME: ${{ env.PACKAGE_NAME }}
      run: |
        set -euo pipefail
        source .github/scripts/setup-rust-build.sh aarch64-linux-android 26
        cargo +stable build --target "$TRIPLE" --release --manifest-path ./userspace/ksud/Cargo.toml
        ls -l target/aarch64-linux-android/release/ksud

    - name: Put ksud into the manager
      run: |
        set -euo pipefail
        mkdir -p nova/manager/app/src/main/jniLibs/arm64-v8a
        cp nova/target/aarch64-linux-android/release/ksud nova/manager/app/src/main/jniLibs/arm64-v8a/libksud.so

    - name: Write signing key
      working-directory: nova/manager
      env:
        KS_B64: ${{ secrets.SUKISU_KEYSTORE_B64 }}
        KS_PASS: ${{ secrets.SUKISU_KEYSTORE_PASSWORD }}
      run: |
        set -euo pipefail
        umask 077
        printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/sukisu.p12"
        {
          echo "KEYSTORE_FILE=$RUNNER_TEMP/sukisu.p12"
          echo "KEYSTORE_PASSWORD=$KS_PASS"
          echo "KEY_ALIAS=sukisu"
          echo "KEY_PASSWORD=$KS_PASS"
        } >> gradle.properties

    - name: Build the APK
      working-directory: nova/manager
      run: |
        set -euo pipefail
        chmod +x ./gradlew
        ./gradlew clean assembleRelease -PKSU_PACKAGE_NAME="$PACKAGE_NAME" -PKSU_NAME="$APP_NAME" --stacktrace
        ls -l app/build/outputs/apk/release/

    - name: Re-sign (v1+v2 only; the kernel and ksud reject any v3 block) and verify against the kernel
      env:
        KS_PASS: ${{ secrets.SUKISU_KEYSTORE_PASSWORD }}
      run: |
        set -euo pipefail
        APK=$(ls nova/manager/app/build/outputs/apk/release/*.apk | head -n 1)
        mkdir -p out
        OUT="out/SUKISU-op15r-${GITHUB_RUN_NUMBER}.apk"
        "$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}/apksigner" sign \
          --ks "$RUNNER_TEMP/sukisu.p12" --ks-key-alias sukisu --ks-pass env:KS_PASS --key-pass env:KS_PASS \
          --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled false --v4-signing-enabled false \
          --out "$OUT" "$APK"
        "$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}/apksigner" verify --verbose "$OUT" | head -n 8
        python3 tools/apk_sig.py "$OUT" --expect-size "$CERT_SIZE" --expect-hash "$CERT_SHA256"
        # package name actually inside the APK
        "$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}/aapt2" dump badging "$OUT" | grep -E "^package: name=|application-label:" | head -n 3
        "$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}/aapt2" dump badging "$OUT" | grep -q "^package: name='${PACKAGE_NAME}'" \
          || { echo "::error::APK package name is not ${PACKAGE_NAME}"; exit 1; }
        sha256sum "$OUT"

    - name: Upload manager APK
      uses: actions/upload-artifact@v4
      with:
        name: manager-apk
        path: out/*.apk
        if-no-files-found: error

  # ------------------------------------------------------------------------------------------------
  # Release: both builds must have passed. Marked as a pre-release because the Nova kernel integration
  # has not been boot-tested on the phone yet.
  # ------------------------------------------------------------------------------------------------
  release:
    name: "GitHub Release"
    needs: [build, manager]
    if: ${{ inputs.publish_release && !inputs.clean_baseline }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Download kernel + manager
      uses: actions/download-artifact@v4
      with:
        path: dl

    - name: Assemble release files
      env:
        REL: ${{ inputs.release_version }}
      run: |
        set -euo pipefail
        . branding.env
        . android16-6.12/root-pins.env
        mkdir -p rel
        ls -R dl | head -n 60
        ZIP=$(find dl -type f -name '*-AnyKernel3.zip' | head -n 1);  test -f "$ZIP"
        IMG=$(find dl -type f -name 'Image' | head -n 1);              test -f "$IMG"
        APK=$(find dl -type f -name '*.apk' | head -n 1);              test -f "$APK"
        CFG=$(find dl -type f -name 'final.config' | head -n 1)
        cp "$ZIP" rel/; cp "$APK" rel/
        cp "$IMG" "rel/$(basename "${ZIP%-AnyKernel3.zip}")-Image"
        [ -n "$CFG" ] && cp "$CFG" "rel/$(basename "${ZIP%-AnyKernel3.zip}")-final.config" || true
        # the kernel must trust exactly this APK
        python3 tools/apk_sig.py "rel/$(basename "$APK")" --expect-size "$CERT_SIZE" --expect-hash "$CERT_SHA256"
        (cd rel && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
        TAG="v${REL}-${GITHUB_RUN_NUMBER}"
        echo "TAG=$TAG" >> "$GITHUB_ENV"
        {
          echo "## ${APP_NAME} for the OnePlus 15R (CPH2767)"
          echo
          echo "**Pre-release: build-verified only, not yet boot-tested on a phone.** Flash the AnyKernel3 zip from a recovery"
          echo "(slot you can restore), keep a stock \`boot\` backup, install the APK **after** the first boot."
          echo
          echo "| File | What |"
          echo "|---|---|"
          echo "| \`$(basename "$ZIP")\` | kernel (AnyKernel3 flasher) |"
          echo "| \`$(basename "${ZIP%-AnyKernel3.zip}")-Image\` | raw kernel Image |"
          echo "| \`$(basename "$APK")\` | ${APP_NAME} manager, package \`${PACKAGE_NAME}\` |"
          echo
          echo "- Kernel source: Google \`kernel/common\` for the phone's firmware (see workflow inputs), \`uname -r\` ends with the release tag."
          echo "- Root driver: SukiSU Nova \`builtin-new\` @ \`${NOVA_PIN:0:8}\`, SUSFS @ \`${SUSFS_PIN:0:8}\`, bound to this APK's signing certificate (size ${CERT_SIZE}, sha256 \`${CERT_SHA256}\`)."
          echo "- Manager/ksud/Zygisk source: SukiSU Nova \`main\` @ \`${NOVA_MANAGER_PIN:0:8}\`, rebranded; launcher icon is original artwork."
          echo "- Both parts are GPL-3.0; sources are in this repository and the pinned upstream commits above."
          echo "- SHA-256 of every file: \`SHA256SUMS.txt\`."
        } > notes.md

    - name: Create the release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        gh release create "$TAG" rel/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
          --prerelease --title "SUKISU ${TAG} (OnePlus 15R)" --notes-file notes.md
        gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,assets --jq '.url, (.assets[].name)'
